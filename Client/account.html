<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your Vibecraft account." />
    <title>Vibecraft — Account</title>
    <link rel="icon" href="assets/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand brand-image" href="index.html" aria-label="Vibecraft254 home"><img src="assets/vbc-logo.png" alt="Vibecraft254" /></a>
      <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="siteNav">Menu</button>
      <nav class="site-nav" id="siteNav" aria-label="Main navigation">
        <button class="nav-close" id="navClose" type="button" aria-label="Close navigation">✕</button>
        <a href="index.html#top">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
        <a class="mobile-cart-link" href="cart.html"><span class="cart-link-label"><svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3h2.4l2.62 12.06a2 2 0 0 0 2 1.54h8.2a2 2 0 0 0 1.96-1.6l1.65-8.4H6.1"/></svg>Cart</span><span class="cart-count" hidden>0</span></a>
      </nav>
      <div class="cart-hover-wrap">
        <button class="cart-toggle" id="cartToggle" type="button" aria-label="Open cart" aria-expanded="false" aria-controls="cartDrawer"><svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3h2.4l2.62 12.06a2 2 0 0 0 2 1.54h8.2a2 2 0 0 0 1.96-1.6l1.65-8.4H6.1"/></svg><span class="cart-count" hidden>0</span></button>
        <div class="cart-preview">
          <div class="cart-preview-body" id="cartPreviewBody"><p class="cart-empty">Your cart is empty.</p></div>
          <a class="text-link cart-preview-link" href="cart.html">View cart <span>→</span></a>
        </div>
      </div>
      <a class="login-link" href="account.html" aria-current="page" data-auth-link>Account</a>
    </header>
    <button class="menu-backdrop" id="menuBackdrop" type="button" aria-label="Close navigation" hidden></button>

    <aside class="cart-drawer" id="cartDrawer" aria-label="Shopping cart" aria-hidden="true">
      <div class="cart-drawer-head">
        <h2>Your cart</h2>
        <button class="nav-close" id="cartClose" type="button" aria-label="Close cart">✕</button>
      </div>
      <div class="cart-drawer-body" id="cartDrawerBody"></div>
      <div class="cart-drawer-footer">
        <div class="cart-drawer-total"><span>Subtotal</span><strong id="cartDrawerSubtotal">KES 0</strong></div>
        <a class="button button-dark auth-submit" href="cart.html">Go to checkout</a>
      </div>
    </aside>
    <button class="menu-backdrop" id="cartBackdrop" type="button" aria-label="Close cart" hidden></button>

    <main class="auth-main">
      <section class="auth-shell">
        <p class="eyebrow">Account</p>
        <h1 id="accountGreeting">Your account.</h1>
        <p class="auth-intro" id="accountIntro">Loading your details...</p>

        <section class="auth-card" id="accountCard" hidden>
          <div class="account-row"><span>Name</span><span id="accountName">-</span></div>
          <div class="account-row"><span>Email</span><span id="accountEmail">-</span></div>
          <div class="account-row"><span>Phone</span><span id="accountPhone">-</span></div>

          <div class="account-actions">
            <a class="button button-dark" href="index.html#collection">Shop projectors</a>
            <button class="button button-outline" id="signOutButton" type="button">Sign out</button>
          </div>
        </section>

        <p class="form-status is-error" id="accountStatus"></p>
      </section>
    </main>

    <script src="api.js"></script>
    <script src="cart-store.js"></script>
    <script src="app.js"></script>
    <script src="account.js"></script>
  </body>
</html>
