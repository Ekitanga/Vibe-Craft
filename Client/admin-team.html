<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>(function(){try{var t=localStorage.getItem('vibecraft_theme');var d=t?t==='dark':false;if(d)document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vibecraft admin team management." />
    <title>Vibecraft — Admin team</title>
    <link rel="icon" href="assets/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="style.css?v=loading-dots-1" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand brand-image" href="index.html" aria-label="Vibecraft254 home"><img class="brand-logo-light" src="assets/vbc-logo.png" alt="Vibecraft254" /><img class="brand-logo-dark" src="assets/vbc-logo-dark.png" alt="Vibecraft254" /></a>
      <nav class="admin-nav" aria-label="Admin navigation">
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-products.html">Products</a>
        <a href="admin-orders.html">Orders</a>
        <a href="admin-customers.html">Customers</a>
        <a href="admin-testimonials.html">Testimonials</a>
        <a href="admin-team.html">Team</a>
      </nav>
      <div class="admin-account">
        <button class="admin-account-toggle" id="adminAccountToggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="adminAccountMenu">
          <span class="admin-account-avatar" id="adminAccountAvatar">A</span>
          <span class="admin-account-caret">▾</span>
        </button>
        <div class="admin-account-menu" id="adminAccountMenu" role="menu" hidden>
          <div class="admin-account-info">
            <strong id="adminAccountMenuName">Admin</strong>
            <span id="adminAccountEmail"></span>
          </div>
          <a class="admin-account-item" href="index.html" role="menuitem">View store</a>
          <div class="admin-account-divider"></div>
          <button class="admin-account-item is-danger" id="adminSignOut" type="button" role="menuitem">Sign out</button>
        </div>
      </div>
    </header>

    <main>
      <div class="admin-shell">
        <div class="admin-topbar">
          <div><p class="eyebrow">Admin</p><h1>Team</h1></div>
        </div>

        <section class="admin-panel">
          <div class="admin-panel-heading">
            <h2>Change your password</h2>
          </div>

          <form id="adminChangePasswordForm" novalidate>
            <div class="form-grid">
              <div class="field">
                <label for="currentPassword">Current password</label>
                <input id="currentPassword" type="password" required />
              </div>
              <div class="field">
                <label for="newPassword">New password</label>
                <input id="newPassword" type="password" required minlength="8" />
                <small>At least 8 characters.</small>
              </div>
            </div>
            <button class="button button-dark auth-submit" type="submit">Update password</button>
            <p class="form-status" id="adminChangePasswordStatus" role="status"></p>
          </form>
        </section>

        <section class="admin-panel">
          <div class="admin-panel-heading">
            <h2>Add an admin</h2>
          </div>

          <form id="adminInviteForm" novalidate>
            <div class="form-grid">
              <div class="field">
                <label for="adminName">Name</label>
                <input id="adminName" required minlength="2" />
              </div>
              <div class="field">
                <label for="adminEmail">Email</label>
                <input id="adminEmail" type="email" required />
              </div>
              <div class="field">
                <label for="adminPassword">Password</label>
                <input id="adminPassword" type="password" required minlength="8" />
                <small>At least 8 characters. Share it with them privately — they can change it once they're in.</small>
              </div>
            </div>
            <button class="button button-dark auth-submit" type="submit">Add admin</button>
            <p class="form-status" id="adminInviteStatus" role="status"></p>
          </form>
        </section>

        <section class="admin-panel">
          <div class="admin-panel-heading">
            <h2>Current admins</h2>
            <span class="form-status" id="adminCount"></span>
          </div>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Added</th>
                </tr>
              </thead>
              <tbody id="adminsTableBody">
                <tr class="empty-row"><td colspan="3"><span class="loading-state"><span class="loading-dot" aria-hidden="true"></span><span>Loading…</span></span></td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <script src="api.js"></script>
    <script src="app.js?v=admin-no-theme-1"></script>
    <script src="admin.js"></script>
    <script src="admin-team.js"></script>
  </body>
</html>
