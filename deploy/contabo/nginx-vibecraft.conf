# nginx site for Vibecraft. setup.sh replaces __DOMAIN__; certbot later adds the
# HTTPS (443) server block and the HTTP→HTTPS redirect automatically.
#
# If you put Cloudflare in front (orange cloud), also install cloudflare-realip.conf
# (see README) so rate limits see the visitor's real IP instead of Cloudflare's.

upstream vibecraft_app {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Product/testimonial videos can be up to 80 MB.
    client_max_body_size 90m;
    client_body_timeout 300s;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;
    gzip_min_length 1024;

    server_tokens off;

    location / {
        proxy_pass http://vibecraft_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so visitors cannot spoof their IP for rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Static assets change only on deploy (they carry ?v= cache-busting versions).
    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|svg|ico|mp4|woff2?)$ {
        proxy_pass http://vibecraft_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }
}
