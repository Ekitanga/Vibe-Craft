services:
  - type: web
    name: vibecraft
    runtime: node
    plan: free
    buildCommand: npm install --prefix Server
    startCommand: npm start
    healthCheckPath: /api/health
    initialDeployHook: npm run db:pg:init
    envVars:
      - key: NODE_ENV
        value: production
      - key: PGSSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
